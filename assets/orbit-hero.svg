<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Credential Orbit banner">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#00A8C4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glowNode" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- starfield -->
  <g fill="#8A93A6" opacity="0.7">
    <circle cx="60" cy="40" r="1.2"/><circle cx="180" cy="90" r="1"/><circle cx="300" cy="30" r="1.4"/>
    <circle cx="470" cy="70" r="1"/><circle cx="700" cy="35" r="1.2"/><circle cx="860" cy="60" r="1"/>
    <circle cx="990" cy="95" r="1.4"/><circle cx="1130" cy="40" r="1"/><circle cx="70" cy="360" r="1.2"/>
    <circle cx="250" cy="380" r="1"/><circle cx="520" cy="395" r="1.4"/><circle cx="760" cy="375" r="1"/>
    <circle cx="950" cy="385" r="1.2"/><circle cx="1100" cy="345" r="1"/><circle cx="120" cy="220" r="1"/>
    <circle cx="1060" cy="150" r="1"/>
  </g>

  <!-- orbital rings (isometric ellipse = depth illusion) -->
  <g fill="none" opacity="0.8">
    <ellipse cx="600" cy="215" rx="210" ry="80" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="10 8" transform="rotate(-12 600 215)" opacity="0.95"/>
    <ellipse cx="600" cy="215" rx="320" ry="125" stroke="#8B5CF6" stroke-width="1.5" transform="rotate(18 600 215)" opacity="0.7"/>
    <ellipse cx="600" cy="215" rx="440" ry="170" stroke="#F59E0B" stroke-width="1" transform="rotate(-6 600 215)" opacity="0.55"/>
  </g>
  <ellipse cx="600" cy="215" rx="520" ry="200" stroke="#34D399" stroke-width="0.75" transform="rotate(8 600 215)" fill="none" opacity="0.35"/>

  <!-- core -->
  <circle cx="600" cy="215" r="95" fill="url(#coreHalo)"/>
  <circle cx="600" cy="215" r="52" fill="url(#coreGlow)" filter="url(#blur)"/>
  <circle cx="600" cy="215" r="34" fill="#00E5FF" opacity="0.9"/>
  <circle cx="600" cy="215" r="14" fill="#FDE68A" opacity="0.95"/>

  <!-- orbiting nodes (one per showcase category) -->
  <g>
    <circle cx="600" cy="215" r="15" fill="#00E5FF" filter="url(#glowNode)" opacity="0.5"/>
    <circle cx="600" cy="215" r="15" fill="#00E5FF"/>
    <text x="600" y="223" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#050608">AI</text>
  </g>
  <g>
    <circle cx="773" cy="150" r="13" fill="#34D399" filter="url(#glowNode)" opacity="0.5"/>
    <circle cx="773" cy="150" r="13" fill="#34D399"/>
    <text x="773" y="157" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#050608">SEC</text>
  </g>
  <g>
    <circle cx="880" cy="255" r="12" fill="#F472B6" filter="url(#glowNode)" opacity="0.5"/>
    <circle cx="880" cy="255" r="12" fill="#F472B6"/>
    <text x="880" y="261" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0B1220">UX</text>
  </g>
  <g>
    <circle cx="368" cy="130" r="12" fill="#F59E0B" filter="url(#glowNode)" opacity="0.5"/>
    <circle cx="368" cy="130" r="12" fill="#F59E0B"/>
    <text x="368" y="136" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0B1220">CLD</text>
  </g>
  <g>
    <circle cx="260" cy="255" r="11" fill="#8B5CF6" filter="url(#glowNode)" opacity="0.5"/>
    <circle cx="260" cy="255" r="11" fill="#8B5CF6"/>
    <text x="260" y="260" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#0B1220">NT</text>
  </g>
  <g>
    <circle cx="700" cy="355" r="11" fill="#60A5FA" filter="url(#glowNode)" opacity="0.5"/>
    <circle cx="700" cy="355" r="11" fill="#60A5FA"/>
    <text x="700" y="360" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#0B1220">DS</text>
  </g>

  <!-- title / subtitle -->
  <text x="600" y="52" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" letter-spacing="10" fill="#E6EAF0">CREDENTIAL ORBIT</text>
  <text x="600" y="80" text-anchor="middle" font-family="monospace" font-size="14" letter-spacing="4" fill="#8A93A6">A 3D SOLAR SYSTEM FOR YOUR CERTIFICATES</text>
  <text x="600" y="100" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="2" fill="#00E5FF">THREE.JS · VANILLA JS · GITHUB PAGES</text>

  <g font-family="monospace" font-size="11" letter-spacing="1">
    <text x="600" y="396" text-anchor="middle" fill="#8A93A6">PRESS / TO SEARCH · CLICK A NODE TO INSPECT · HOVER CARDS TO PREVIEW</text>
  </g>
</svg>