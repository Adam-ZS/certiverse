<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Certiverse banner">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#00A8C4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glowNode" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>

  <!-- starfield -->
  <g fill="#8A93A6" opacity="0.7">
    <circle cx="60" cy="44" r="1.2"/><circle cx="180" cy="96" r="1"/><circle cx="300" cy="34" r="1.4"/>
    <circle cx="470" cy="76" r="1"/><circle cx="700" cy="38" r="1.2"/><circle cx="860" cy="64" r="1"/>
    <circle cx="990" cy="100" r="1.4"/><circle cx="1130" cy="44" r="1"/><circle cx="70" cy="168" r="1"/>
    <circle cx="990" cy="150" r="1"/><circle cx="70" cy="420" r="1.2"/><circle cx="250" cy="444" r="1"/>
    <circle cx="520" cy="456" r="1.4"/><circle cx="760" cy="440" r="1"/><circle cx="950" cy="448" r="1.2"/>
    <circle cx="1100" cy="402" r="1"/><circle cx="115" cy="300" r="1"/><circle cx="1090" cy="240" r="1"/>
  </g>

  <!-- orbital rings (isometric ellipse = depth illusion) -->
  <g fill="none" opacity="0.8">
    <ellipse cx="600" cy="322" rx="210" ry="82" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="10 8" transform="rotate(-12 600 322)" opacity="0.95"/>
    <ellipse cx="600" cy="322" rx="330" ry="126" stroke="#8B5CF6" stroke-width="1.5" transform="rotate(18 600 322)" opacity="0.7"/>
    <ellipse cx="600" cy="322" rx="460" ry="158" stroke="#F59E0B" stroke-width="1" transform="rotate(-6 600 322)" opacity="0.55"/>
  </g>

  <!-- core -->
  <circle cx="600" cy="322" r="95" fill="url(#coreHalo)"/>
  <circle cx="600" cy="322" r="52" fill="url(#coreGlow)" filter="url(#blur)"/>
  <circle cx="600" cy="322" r="34" fill="#00E5FF" opacity="0.9"/>
  <circle cx="600" cy="322" r="14" fill="#FDE68A" opacity="0.95"/>

  <!-- orbiting nodes (one per showcase category) -->
  <g>
    <circle cx="600" cy="322" r="16" fill="#00E5FF" filter="url(#glowNode)" opacity="0.5"/>
    <circle cx="600" cy="322" r="16" fill="#00E5FF"/>
    <text x="600" y="330" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#050608">AI</text>
  </g>
  <g>
    <circle cx="792" cy="258" r="13" fill="#34D399" filter="url(#glowNode)" opacity="0.5"/>
    <circle cx="792" cy="258" r="13" fill="#34D399"/>
    <text x="792" y="265" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#050608">SEC</text>
  </g>
  <g>
    <circle cx="896" cy="372" r="12" fill="#F472B6" filter="url(#glowNode)" opacity="0.5"/>
    <circle cx="896" cy="372" r="12" fill="#F472B6"/>
    <text x="896" y="378" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0B1220">UX</text>
  </g>
  <g>
    <circle cx="408" cy="246" r="12" fill="#F59E0B" filter="url(#glowNode)" opacity="0.5"/>
    <circle cx="408" cy="246" r="12" fill="#F59E0B"/>
    <text x="408" y="252" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#0B1220">CLD</text>
  </g>
  <g>
    <circle cx="300" cy="354" r="11" fill="#8B5CF6" filter="url(#glowNode)" opacity="0.5"/>
    <circle cx="300" cy="354" r="11" fill="#8B5CF6"/>
    <text x="300" y="360" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#0B1220">NT</text>
  </g>
  <g>
    <circle cx="820" cy="452" r="11" fill="#60A5FA" filter="url(#glowNode)" opacity="0.5"/>
    <circle cx="820" cy="452" r="11" fill="#60A5FA"/>
    <text x="820" y="457" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#0B1220">DS</text>
  </g>

  <!-- title block with consistent margins -->
  <text x="600" y="66" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" letter-spacing="12" fill="#E6EAF0">CERTIVERSE</text>
  <text x="600" y="98" text-anchor="middle" font-family="monospace" font-size="14" letter-spacing="4" fill="#8A93A6">A 3D SOLAR SYSTEM FOR YOUR CERTIFICATES</text>
  <text x="600" y="120" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="2" fill="#00E5FF">THREE.JS · VANILLA JS · GITHUB PAGES</text>
  <line x1="430" y1="140" x2="770" y2="140" stroke="#2A3446" stroke-width="1.5"/>

  <g font-family="monospace" font-size="11" letter-spacing="1">
    <text x="600" y="466" text-anchor="middle" fill="#8A93A6">PRESS / TO SEARCH · CLICK A NODE TO INSPECT · HOVER CARDS TO PREVIEW</text>
  </g>
</svg>